name: Deploy to VPS

on:
  push:
    branches:
      - main # Or your default branch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: main # Add this line

    steps:
      - name: Deploy and Verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # Pull the latest code from the main branch
            git pull origin main
            
            # Step 1: Build images explicitly to see build logs
            # This step will fail if any Docker image fails to build.
            echo "--- Building Docker containers ---"
            docker compose build --no-cache frontend
            docker compose build api
            
            # Step 2: Start the services in detached mode
            echo "--- Starting Docker containers ---"
            docker compose up -d
            
            # Step 3: Wait and perform a health check
            echo "--- Waiting 30 seconds for containers to stabilize ---"
            sleep 30
            
            echo "--- Checking container health ---"
            # Print the status of all containers for logging
            docker compose ps

            # Script to check for non-running containers.
            # It gets all services from the compose file and checks their status.
            # If any container is not 'running', the script exits with an error, failing the workflow.
            if [ -n "$(docker compose ps -q | xargs docker inspect -f '{{ .State.Status }} {{ .Name }}' | grep -v "running")" ]; then
              echo "One or more containers are not running. Deployment failed."
              exit 1
            else
              echo "All containers are running successfully."
            fi

            # Step 4: Clean up old images if deployment was successful
            echo "--- Pruning old Docker images ---"
            docker image prune -f