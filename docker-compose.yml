# docker-compose.yml

services:
  # 1. Nginx Reverse Proxy (The new public entrypoint)
  nginx:
    image: nginx:1.25-alpine
    container_name: finance_nginx
    restart: always
    ports:
      # Expose port 8090 for the proxy manager
      - "8090:80"
    volumes:
      # Mount our custom config file
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - frontend
    networks:
      - default # Das ist das interne Netzwerk deines Stacks
      - nginx-proxy # Das ist das neue, gemeinsame Netzwerk

  # 2. SvelteKit Frontend Service (New)
  frontend:
    build: ./frontend
    container_name: finance_frontend
    restart: always
    ports:
      - "5173:5173"
    networks:
      - default

  # 3. NestJS API Service (Modified)
  api:
    build: ./backend
    container_name: finance_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  # 4. Database Service (Unchanged)
  db:
    image: postgres:15-alpine
    container_name: finance_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  postgres_data:

networks:
  default: # Definiert das Standard-Netzwerk für diesen Stack
    driver: bridge
  nginx-proxy: # Definiert das externe Netzwerk
    external: true