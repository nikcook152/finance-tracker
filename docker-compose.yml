# docker-compose.yml

services:
  # 1. NestJS API Service (Updated)
  api:
    build: ./backend
    container_name: finance_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Construct DATABASE_URL from variables in the .env file
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  # 2. SvelteKit Frontend Service (Cleaned up)
  frontend:
    build: ./frontend
    container_name: finance_frontend
    restart: always
    ports:
      - "5173:5173"
    networks:
      - default

  # 3. Database Service (Updated)
  db:
    image: postgres:15-alpine
    container_name: finance_db
    restart: always
    env_file:
      - .env
    # Map the user's variable names to what the postgres image expects
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Use $$ to escape variables for shell execution inside the container
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # 4. Nginx Reverse Proxy (Cleaned up)
  nginx:
    image: nginx:1.25-alpine
    container_name: finance_nginx
    restart: always
    ports:
      # Expose port 8090 for the proxy manager
      - "8090:80"
    volumes:
      # Mount our custom config file
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - frontend
    networks:
      - default
      - nginx-proxy # Das ist das neue, gemeinsame Netzwerk

volumes:
  postgres_data:

networks:
  default: # Definiert das Standard-Netzwerk für diesen Stack
    driver: bridge
  nginx-proxy: # Definiert das externe Netzwerkk
    external: true