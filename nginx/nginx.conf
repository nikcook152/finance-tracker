# nginx/nginx.conf

events {}

http {
  server {
    listen 80;

    # Rule 1: Requests for the API (/api/...)
    location /api/ {
      # Remove /api from the path before forwarding
      rewrite /api/(.*) /$1 break;
      # Forward to the backend container
      proxy_pass http://api:3000;
    }

    # Rule 2: All other requests
    location / {
      # Forward to the frontend container
      proxy_pass http://frontend:3000;
    }
  }
}