# nginx/nginx.conf

events {}

http {
  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # HTTP server - redirect to HTTPS in production
  server {
    listen 80;

    # Rule 1: Requests for the API (/api/...)
    location /api/ {
      # Remove /api from the path before forwarding
      rewrite /api/(.*) /$1 break;
      # Forward to the backend container
      proxy_pass http://api:3000;
      
      # Proxy headers for proper forwarding
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rule 2: All other requests
    location / {
      # Forward to the frontend container
      proxy_pass http://frontend:3000;
      
      # Proxy headers for proper forwarding
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # HTTPS server (uncomment when SSL certificates are configured)
